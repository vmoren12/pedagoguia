<!DOCTYPE html>

<script>

    try {
      var t = localStorage.getItem('lecturia:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<main class="hero" style="border:0;min-height:100dvh;display:grid;align-items:center">

    <p><a class="btn btn-primary" href="/lecturia/">Torna al catàleg
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></p>
  </div>

</html>
